<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IdleRPG Offline</title>
  <meta name="theme-color" content="#05040a" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #05040a;
      color: #d6ccdf;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      padding: 1.25rem;
    }
    .card {
      max-width: 34rem;
      border: 1px solid rgba(0, 229, 199, 0.25);
      border-radius: 12px;
      background: rgba(12, 10, 20, 0.95);
      padding: 1.25rem;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.4);
    }
    h1 {
      margin: 0 0 0.6rem;
      color: #00e5c7;
      font-size: 1.2rem;
    }
    p {
      margin: 0.45rem 0;
      line-height: 1.5;
    }
    a {
      color: inherit;
    }
  </style>
</head>
<body>
  <section class="card">
    <h1>IdleRPG is offline right now</h1>
    <p>The app shell is loaded from cache, but live shard data needs a network connection.</p>
    <p>When you are back online, reopen <a href="/">the homepage</a> to resume real-time updates.</p>
  </section>
</body>
</html>
